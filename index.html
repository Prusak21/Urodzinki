<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wszystkiego najlepszego, Pi!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
<style>
  :root {
    --bg1: #ff9ac8;
    --bg2: #ffd1e8;
    --ink: #fff;
    --shadow: #c2185b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2), #ffb3d9, var(--bg1));
    background-size: 300% 300%;
    animation: bg 10s ease infinite;
    font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  @keyframes bg { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .heart {
    position: absolute;
    bottom: -60px;
    animation: rise linear infinite;
    will-change: transform;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) rotate(-10deg) scale(.8); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translateY(-55vh) translateX(20px) rotate(10deg) scale(1.1); }
    100% { transform: translateY(-115vh) translateX(-20px) rotate(-10deg) scale(.9); opacity: 0; }
  }

  main { position: relative; z-index: 2; padding: 1rem; }

  h1 {
    font-size: clamp(2.6rem, 11vw, 8rem);
    line-height: 1.05;
    color: var(--ink);
    text-shadow: 0 4px 0 var(--shadow), 0 8px 18px rgba(194, 24, 91, .45);
    font-weight: 900;
  }
  h1 .line { display: block; white-space: nowrap; }
  h1 .ch {
    display: inline-block;
    animation: wave 1.6s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { transform: translateY(0) rotate(-4deg) scale(1); }
    25%      { transform: translateY(-.14em) rotate(4deg) scale(1.08); }
    50%      { transform: translateY(0) rotate(-4deg) scale(1); }
    75%      { transform: translateY(.06em) rotate(3deg) scale(.96); }
  }
  h1 .pi { color: #fff3a8; font-size: 1.25em; }

  .cats {
    margin-top: 2rem;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: .4rem 1rem;
  }
  .cat {
    font-size: clamp(3rem, 10vw, 6rem);
    display: inline-block;
    transform-origin: 50% 90%;
    animation: dance .8s ease-in-out infinite;
    user-select: none;
    cursor: pointer;
  }
  .cat:nth-child(even) { animation-name: dance2; }
  @keyframes dance {
    0%, 100% { transform: rotate(-14deg) translateY(0); }
    25%      { transform: rotate(0) translateY(-.3em) scale(1.1); }
    50%      { transform: rotate(14deg) translateY(0); }
    75%      { transform: rotate(0) translateY(-.3em) scale(1.1); }
  }
  @keyframes dance2 {
    0%, 100% { transform: rotate(14deg) translateY(0) scaleX(-1); }
    25%      { transform: rotate(0) translateY(-.3em) scaleX(-1) scale(1.1); }
    50%      { transform: rotate(-14deg) translateY(0) scaleX(-1); }
    75%      { transform: rotate(0) translateY(-.3em) scaleX(-1) scale(1.1); }
  }

  .side-cat {
    position: fixed;
    bottom: 0;
    font-size: clamp(3rem, 12vw, 7rem);
    z-index: 2;
    animation: bounce .7s ease-in-out infinite alternate;
  }
  .side-cat.l { left: 2vw; }
  .side-cat.r { right: 2vw; animation-delay: .35s; }
  @keyframes bounce { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-1.2rem) rotate(8deg); } }

  /* ===== Intro z prezentem ===== */
  .stage-wish { opacity: 0; transition: opacity 1.2s ease; }
  body.revealed .stage-wish { opacity: 1; }
  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffb3d9, #ffd1e8);
    transition: opacity 1s ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro.shake { animation: screenshake .5s; }
  @keyframes screenshake {
    0%,100% { transform: translate(0); }
    20% { transform: translate(-14px, 8px); } 40% { transform: translate(12px, -10px); }
    60% { transform: translate(-10px, -6px); } 80% { transform: translate(8px, 10px); }
  }
  .holder { position: relative; width: min(70vw, 340px); aspect-ratio: 1; }
  .cat-big {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    font-size: clamp(8rem, 38vw, 15rem); line-height: 1;
    animation: sway 2s ease-in-out infinite;
  }
  .cat-big.burnt { animation: none; filter: grayscale(.9) brightness(.55) contrast(1.2); transform: translateX(-50%) rotate(-6deg); transition: filter .4s; }
  @keyframes sway { 0%,100% { transform: translateX(-50%) rotate(-3deg); } 50% { transform: translateX(-50%) rotate(3deg); } }
  .gift {
    position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
    font-size: clamp(5rem, 24vw, 9rem); line-height: 1;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    transition: filter .3s;
    z-index: 2;
  }
  .gift.pop { animation: pop .35s ease; }
  @keyframes pop {
    0% { transform: translateX(-50%) scale(1); }
    40% { transform: translateX(-50%) scale(1.3) rotate(-8deg); }
    100% { transform: translateX(-50%) scale(1); }
  }
  .gift.idle { animation: wiggle 1.4s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: translateX(-50%) rotate(0); } 50% { transform: translateX(-50%) rotate(-5deg) scale(1.05); } }
  .paw { position: absolute; bottom: 14%; font-size: clamp(2rem, 9vw, 3.4rem); z-index: 3; pointer-events: none; }
  .paw.l { left: 10%; } .paw.r { right: 10%; }
  .hint {
    margin-top: 1.5rem; font-size: clamp(1.2rem, 4.5vw, 1.8rem); font-weight: 800;
    color: #fff; text-shadow: 0 3px 0 #c2185b; padding: 0 1rem;
  }
  .flash {
    position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at var(--x, 50%) var(--y, 60%), #fff 0%, #fff6a8 25%, #ff9a3c 55%, transparent 75%);
  }
  .boom {
    position: fixed; z-index: 21; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0);
    font-size: clamp(4rem, 18vw, 10rem); font-weight: 900; color: #ffeb3b;
    text-shadow: 0 6px 0 #d81b60, 0 0 30px #ff9800; pointer-events: none; white-space: nowrap;
  }
  .bit { position: fixed; z-index: 22; pointer-events: none; font-size: 2rem; will-change: transform; }
  .shard { position: fixed; z-index: 22; pointer-events: none; will-change: transform; }

  @media (prefers-reduced-motion: reduce) { #intro.shake { animation: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 6s !important; }
    .hearts { display: none; }
  }
</style>
</head>
<body>

<div class="hearts stage-wish" id="hearts" aria-hidden="true"></div>
<div class="side-cat l stage-wish" aria-hidden="true">🐈</div>
<div class="side-cat r stage-wish" aria-hidden="true">🐈‍⬛</div>


<div id="intro">
  <div class="holder">
    <div class="cat-big" id="catBig" aria-hidden="true">🐱</div>
    <span class="paw l" aria-hidden="true">🐾</span>
    <span class="paw r" aria-hidden="true">🐾</span>
    <div class="gift idle" id="gift" role="button" tabindex="0" aria-label="Prezent, kliknij żeby otworzyć">🎁</div>
  </div>
  <p class="hint" id="hint">Kotek ma dla Ciebie prezent! Kliknij go 🎀</p>
</div>
<div class="flash" id="flash"></div>
<div class="boom" id="boom">BUM! 💥</div>

<main class="stage-wish">
  <h1 id="title" aria-label="Wszystkiego najlepszego, Pi!">
    <span class="line" data-text="Wszystkiego"></span>
    <span class="line" data-text="najlepszego"></span>
    <span class="line pi" data-text="Pi! 💖"></span>
  </h1>

  <div class="cats" aria-hidden="true">
    <span class="cat">🐱</span>
    <span class="cat">😸</span>
    <span class="cat">🐈</span>
    <span class="cat">😻</span>
    <span class="cat">🐈‍⬛</span>
    <span class="cat">😺</span>
  </div>
</main>

<script>
  // Litery tytułu: każda tańczy z lekkim opóźnieniem
  var n = 0;
  document.querySelectorAll('#title .line').forEach(function (line) {
    Array.from(line.dataset.text).forEach(function (c) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = c;
      s.style.animationDelay = (n++ * 0.09) + 's';
      line.appendChild(s);
    });
  });

  // Serduszka unoszące się w górę
  var box = document.getElementById('hearts');
  var set = ['💖', '💗', '💕', '💓', '💘', '❤️', '💞', '🩷'];
  function spawn(initial) {
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = set[Math.floor(Math.random() * set.length)];
    var dur = 5 + Math.random() * 6;
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (1 + Math.random() * 2.2) + 'rem';
    h.style.animationDuration = dur + 's';
    h.style.animationDelay = (initial ? -Math.random() * dur : 0) + 's';
    box.appendChild(h);
    setTimeout(function () { h.remove(); }, (dur + 1) * 1000);
  }
  var started = false;
  function startHearts() {
    if (started) return; started = true;
    for (var i = 0; i < 40; i++) spawn(true);
    setInterval(spawn, 280);
  }

  // Bonus: klik w kotka = wybuch serduszek
  document.querySelectorAll('.cat').forEach(function (cat) {
    cat.addEventListener('click', function () {
      for (var i = 0; i < 12; i++) spawn(false);
    });
  });
  // ===== Prezent =====
  var NEED = 5, clicks = 0, exploded = false;
  var gift = document.getElementById('gift'), hint = document.getElementById('hint');
  var intro = document.getElementById('intro'), catBig = document.getElementById('catBig');
  var texts = ['Pamiętaj że cię KOCHAM ❤️', 'Najbardziej na świecie 🙀', 'KOOOOOOOOOOOOOCHAM 😊', 'A TERAZ... 😱'];

  function explode() {
    exploded = true;
    var r = gift.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    gift.style.visibility = 'hidden';
    hint.textContent = '';
    catBig.textContent = '🙀';
    catBig.classList.add('burnt');
    intro.classList.add('shake');

    var flash = document.getElementById('flash');
    flash.style.setProperty('--x', cx + 'px'); flash.style.setProperty('--y', cy + 'px');
    flash.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, easing: 'ease-out' });

    var boom = document.getElementById('boom');
    boom.animate([
      { transform: 'translate(-50%,-50%) scale(0) rotate(-10deg)', opacity: 1 },
      { transform: 'translate(-50%,-50%) scale(1.2) rotate(6deg)', opacity: 1, offset: .35 },
      { transform: 'translate(-50%,-50%) scale(1.4) rotate(-4deg)', opacity: 0 }
    ], { duration: 1300, easing: 'ease-out' });

    // konfetti i iskry z miejsca prezentu
    var emo = ['🎉', '✨', '💖', '🎊', '⭐', '💥', '🔥', '🎀'];
    var colors = ['#ff4081', '#ffeb3b', '#00e5ff', '#76ff03', '#ff9800', '#e040fb'];
    for (var i = 0; i < 70; i++) {
      var a = Math.random() * Math.PI * 2, d = 120 + Math.random() * Math.min(innerWidth, 700) * .6;
      var el = document.createElement('div');
      var isEmoji = i % 3 === 0;
      if (isEmoji) { el.className = 'bit'; el.textContent = emo[i % emo.length]; }
      else {
        el.className = 'shard';
        el.style.width = (6 + Math.random() * 8) + 'px'; el.style.height = (10 + Math.random() * 12) + 'px';
        el.style.background = colors[i % colors.length];
      }
      el.style.left = cx + 'px'; el.style.top = cy + 'px';
      document.body.appendChild(el);
      var dx = Math.cos(a) * d, dy = Math.sin(a) * d;
      el.animate([
        { transform: 'translate(-50%,-50%) scale(.3) rotate(0)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1.2) rotate(' + (Math.random() * 720 - 360) + 'deg)', opacity: 1, offset: .6 },
        { transform: 'translate(' + dx * 1.1 + 'px,' + (dy + 160) + 'px) scale(.8) rotate(' + (Math.random() * 900 - 450) + 'deg)', opacity: 0 }
      ], { duration: 1400 + Math.random() * 900, easing: 'cubic-bezier(.1,.7,.3,1)' })
        .onfinish = (function (e) { return function () { e.remove(); }; })(el);
    }

    // po chwili: znika intro, wjeżdżają życzenia
    setTimeout(function () {
      intro.classList.add('gone');
      document.body.classList.add('revealed');
      startHearts();
      setTimeout(function () { intro.remove(); }, 1100);
    }, 2300);
  }

  function hit() {
    if (exploded) return;
    clicks++;
    gift.classList.remove('idle', 'pop'); void gift.offsetWidth; gift.classList.add('pop');
    gift.style.filter = 'drop-shadow(0 0 ' + (clicks * 6) + 'px #ff5722) saturate(' + (1 + clicks * .25) + ')';
    if (clicks >= NEED) explode();
    else hint.textContent = texts[clicks - 1];
  }
  gift.addEventListener('click', hit);
  gift.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hit(); } });

</script>
</body>
</html>
